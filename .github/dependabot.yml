version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    # Wait before adopting new releases, so a compromised or broken version is
    # more likely to be caught and pulled first. Security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Vite 8 replaces Rollup and esbuild with Rolldown and Oxc. Until the build
    # and tests are migrated, a major bump cannot pass: the public module
    # inventory in vite.config.mjs calls Rollup's getWatchFiles(), which
    # Rolldown does not provide, and six test files import the esbuild that
    # Vite 6 installs. @vitejs/plugin-react 6 requires Vite 8, so the two must
    # be raised together in one change. Remove both entries with that change.
    # Security updates are not affected by these entries.
    ignore:
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
